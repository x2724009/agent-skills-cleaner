  <path d="M14 50 C14 39 22 32 32 32 C42 32 50 39 50 50 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="27" cy="42" r="2.3" fill="#2346ad"/>
  <circle cx="37" cy="42" r="2.3" fill="#2346ad"/>
