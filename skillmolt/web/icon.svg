<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SkillMolt">
  <!-- The shed shell: a dashed ghost of the crab, left behind up and to the left -->
  <ellipse cx="22" cy="27" rx="16" ry="11" transform="rotate(-14 22 27)" fill="#9db4ee" fill-opacity=".28" stroke="#8aa3e6" stroke-width="2" stroke-dasharray="3.2 2.6"/>
  <!-- Arms -->
  <path d="M20 37 L13 30 M48 37 L55 30" stroke="#2a55c4" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Claws: open pincers -->
  <path d="M15.5 30.5 A7 7 0 1 1 18.6 21.4 L12.4 24.6 Z" fill="#2a55c4"/>
  <path d="M52.5 30.5 A7 7 0 1 0 49.4 21.4 L55.6 24.6 Z" fill="#2a55c4"/>
  <!-- Legs -->
  <path d="M22 45 L15 50 M25 48 L20 55 M46 45 L53 50 M43 48 L48 55" stroke="#2a55c4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <ellipse cx="34" cy="40" rx="16" ry="11" fill="#2a55c4"/>
  <ellipse cx="30" cy="36" rx="8" ry="3.4" fill="#5c80e3"/>
  <!-- Eye stalks and eyes -->
  <path d="M30 30 L29 24 M38 30 L39 24" stroke="#2a55c4" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="29" cy="22.5" r="3.4" fill="#ffffff" stroke="#2a55c4" stroke-width="1.6"/>
  <circle cx="39" cy="22.5" r="3.4" fill="#ffffff" stroke="#2a55c4" stroke-width="1.6"/>
  <circle cx="29.6" cy="23" r="1.5" fill="#10204d"/>
  <circle cx="39.6" cy="23" r="1.5" fill="#10204d"/>
  <!-- Smile -->
  <path d="M30.5 43 Q34 45.5 37.5 43" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>
