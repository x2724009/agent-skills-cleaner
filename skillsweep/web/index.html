<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Sweep</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<script>window.SKILL_SWEEP = { token: "__TOKEN__", readonly: __READONLY__ };</script>
</head>
<body>
<header class="top">
  <div class="wrap">
  <div class="brand">
    <img src="/icon.svg" alt="" width="28" height="28">
    <div>
      <h1>Skill Sweep</h1>
      <p class="sub" data-i18n="tagline"></p>
    </div>
  </div>
  <div class="top-actions">
    <button class="ghost" id="btn-history" data-i18n="history"></button>
    <button class="ghost" id="btn-lang">EN</button>
    <button class="primary" id="btn-rescan" data-i18n="rescan"></button>
  </div>
  </div>
</header>

<div class="banner" id="readonly-banner" hidden><div class="wrap"><div data-i18n="readonlyBanner"></div></div></div>

<main class="wrap">
  <section class="overview">
    <p class="ov-line" id="ov-line"></p>
    <div class="dist" id="dist" aria-hidden="true"></div>
    <div class="legend" id="summary"></div>
    <details class="how">
      <summary data-i18n="howTitle"></summary>
      <div class="muted" data-i18n-html="howBody"></div>
    </details>
  </section>

  <section class="toolbar">
    <input type="search" id="q" data-i18n-placeholder="search" aria-label="search">
    <select id="agent" aria-label="agent"></select>
    <div class="seg" id="view-seg" role="group">
      <button data-view="verdict" data-i18n="viewVerdict"></button>
      <button data-view="package" data-i18n="viewPackage"></button>
    </div>
    <button class="danger solid" id="btn-bulk" hidden></button>
  </section>

  <section id="list" aria-live="polite"></section>
  <section id="broken"></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <h2 data-i18n="history"></h2>
    <button class="ghost" id="btn-close-drawer" aria-label="close">✕</button>
  </div>
  <p class="muted" data-i18n="historyHint"></p>
  <div id="history"></div>
</aside>

<dialog id="confirm">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <div id="confirm-body"></div>
    <div class="dialog-actions">
      <button value="cancel" class="ghost" data-i18n="cancel"></button>
      <button value="ok" class="danger solid" id="confirm-ok"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
