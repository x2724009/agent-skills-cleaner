[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills-cleaner"
version = "0.1.0"
description = "Find, audit and clean up the agent skills (SKILL.md) installed for Claude Code, Codex, Cursor, Gemini CLI, Copilot and more, judged by the models you actually run."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["agent-skills", "skills", "claude-code", "claude-skills", "codex", "cursor", "gemini-cli", "copilot", "skill-manager", "cleanup", "llm", "ai-agents"]

[project.urls]
Homepage = "https://github.com/x2724009/agent-skills-cleaner"

[project.scripts]
agent-skills-cleaner = "agent_skills_cleaner.__main__:main"
skills-cleaner = "agent_skills_cleaner.__main__:main"

[tool.setuptools]
packages = ["agent_skills_cleaner"]

[tool.setuptools.package-data]
agent_skills_cleaner = ["web/*", "data/*.json"]
